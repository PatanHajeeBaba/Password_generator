<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
        <title>Password Generator</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    </head>
    <body>

        <div class="bg-grid"></div>
        <div class="bg-glow"></div>

        <div id="password-generator">

            <div class="header">
                <div class="lock-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1>PassForge</h1>
                <p class="subtitle">Craft unbreakable passwords</p>
            </div>

            <div id="password">
                <input type="text" id="result" value="password" readonly/>
                <button id="copy-button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span>COPY</span>
                </button>
            </div>

            <!-- <div class="strength-bar-wrap">
                <div class="strength-bar"><div class="strength-fill"></div></div>
                <span class="strength-label">strength</span>
            </div> -->

            <div class="length-section">
                <div class="length-header">
                    <label for="password-length">Password Length</label>
                    <!-- <output>8</output> -->
                </div>
                <input type="range" min="8" max="32" value="8" name="password-length"
            id="password-length" oninput="this.nextElementSibling.value = this.value">
                <output>8</output>
            </div>

            <div id="options">
                <label>
                    <input type="checkbox" id="lowercase-option" />
                    <span class="option-content">
                        <span class="option-icon">a–z</span>
                        <span class="option-text">Lowercase</span>
                    </span>
                </label>

                <label>
                    <input type="checkbox" id="uppercase-option" />
                    <span class="option-content">
                        <span class="option-icon">A–Z</span>
                        <span class="option-text">Uppercase</span>
                    </span>
                </label>

                <label>
                    <input type="checkbox" id="number-option" />
                    <span class="option-content">
                        <span class="option-icon">0–9</span>
                        <span class="option-text">Numbers</span>
                    </span>
                </label>

                <label>
                    <input type="checkbox" id="special-option" />
                    <span class="option-content">
                        <span class="option-icon">!@#</span>
                        <span class="option-text">Symbols</span>
                    </span>
                </label>
            </div>

            <button id="generate-button">
                <span class="btn-text">GENERATE</span>
                <span class="btn-arrow">→</span>
            </button>

        </div>

        <script src="password_generator.js"></script>
    </body>
</html>
